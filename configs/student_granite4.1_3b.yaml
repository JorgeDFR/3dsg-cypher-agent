model:
  base_model: ibm-granite/granite-4.1-3b
  tokenizer: null
  trust_remote_code: true
  dtype: bfloat16
  load_in_4bit: true

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: auto

training:
  output_dir: outputs/lora/granite4.1-3b-finetune
  loss_mode: assistant-only
  max_length: 4096
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  num_train_epochs: 2
  warmup_steps: 0.03
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: none
