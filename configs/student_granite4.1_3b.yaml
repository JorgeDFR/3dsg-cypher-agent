model:
  base_model: ibm-granite/granite-4.1-3b
  tokenizer: null
  trust_remote_code: true
  dtype: bfloat16
  load_in_4bit: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: auto

training:
  output_dir: outputs/lora/granite4.1-3b-finetune
  loss_mode: assistant-only
  max_length: 5000
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  num_train_epochs: 2
  warmup_steps: 0.05
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 2
  early_stopping_threshold: 1e-4
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: none

ollama_export:
  model_name: granite4.1-3b-finetune
  export_root: outputs/ollama
  gguf_outtype: bf16
  quantizations:
    - Q4_K_M
    - Q8_0
  modelfile_quantization: Q4_K_M
