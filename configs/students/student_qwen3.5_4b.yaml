model:
  base_model: Qwen/Qwen3.5-4B
  tokenizer: null
  trust_remote_code: true
  dtype: bfloat16
  load_in_4bit: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear

training:
  include_reasoning: true #false
  output_dir: outputs/lora/qwen3.5-4b-finetune
  loss_mode: assistant-only
  loss_type: chunked_nll
  max_length: 5000
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  num_train_epochs: 2
  warmup_steps: 0.05
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 2
  early_stopping_threshold: 1e-4
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: none

inference:
  enable_thinking: true #false

ollama_export:
  model_name: qwen3.5-4b-finetune
  export_root: outputs/ollama
  gguf_outtype: bf16
  quantizations:
    - Q4_K_M
    - Q8_0
  convert_args:
    - --no-mtp # https://github.com/ggml-org/llama.cpp/issues/24737
  modelfile_quantization: bf16
