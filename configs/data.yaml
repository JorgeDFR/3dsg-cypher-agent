dataset_id: dataset_demo
scenes:
  - scene_id: uhumans2_office
    scene_path: data/scenes/uhumans2_office.json
  - scene_id: spot_demo
    scene_path: data/scenes/spot_demo.json

schema_path: schema_3dsg.yaml
question_sets:
  - name: cypher_qa
    experiment_profile_path: cypher_qa_template.yaml
    question_templates_path: cypher_qa_3dsg.yaml
  - name: cypher_pddl
    experiment_profile_path: cypher_pddl_template.yaml
    question_templates_path: cypher_pddl_3dsg.yaml
max_per_task_type: null
optimize_student_traces: false

split:
  train_size: 0.8
  eval_size: 0.1
  test_size: 0.1
  seed: 42
  split_by_scene: false
  challenge_questions_per_task_type: 10
  challenge_task_types:
    - nearest_object_to_object
    - place_hops
    - objects_in_room_class
    - pddl_inspect_object_class
    - pddl_object_not_in_place
    - pddl_visit_place_and_end_in_room
