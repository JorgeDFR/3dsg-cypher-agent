scene_id: uhumans2
scene_path: data/scenes/3dsg_uhumans2.json

schema_path: schema_3dsg.yaml
experiment_profile_path: cypher_qa_template.yaml
question_templates_path: cypher_qa_3dsg.yaml
max_per_task_type: null
optimize_student_traces: false

split:
  train_size: 0.7
  eval_size: 0.15
  test_size: 0.15
  seed: 42
  challenge_task_types:
    - nearest_object_to_object
    - place_hops
    - objects_in_place_symbol

ollama_export:
  model_name: 3dsg-cypher-agent-qwen3-4b-distilled
  gguf_path: outputs/ollama/3dsg-cypher-agent-qwen3-4b-distilled.Q4_K_M.gguf
  modelfile_path: outputs/ollama/Modelfile
  system_prompt: |
    You are a 3D scene graph agent. Use the run_cypher_query tool for read-only Cypher queries.
    Return compact final answers wrapped in <answer>...</answer>.
