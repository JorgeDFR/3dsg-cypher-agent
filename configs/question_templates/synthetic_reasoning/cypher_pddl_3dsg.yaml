    - kind: match
      role: first
      layers: []
      properties:
        nodeSymbol: {kind: binding, name: first}
      optional: false
    - kind: match
      role: second
      layers: []
      properties:
        nodeSymbol: {kind: binding, name: second}
      optional: false
    - kind: filter
      expression:
