version: 1
templates:
  pddl_visit_object_symbol:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: object}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
  pddl_end_at_object_symbol:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: object}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
  pddl_inspect_object_symbol:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: object}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
  pddl_hold_object_class:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        class: {kind: binding, name: class}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
    - kind: order
      items:
      - expression: {kind: ref, name: object}
        direction: ASC
  pddl_visit_object_class:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        class: {kind: binding, name: class}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
    - kind: order
      items:
      - expression: {kind: ref, name: object}
        direction: ASC
  pddl_end_at_object_class:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        class: {kind: binding, name: class}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
    - kind: order
      items:
      - expression: {kind: ref, name: object}
        direction: ASC
  pddl_inspect_nearest_object:
    operations:
    - kind: match
      role: source
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: case.object}
      optional: false
    - kind: match
      role: target
      layers: [Object]
      properties:
        class: {kind: binding, name: case.class}
      optional: false
    - kind: filter
      expression:
        kind: compare
        left: {kind: ref, name: target}
        operator: <>
        right: {kind: ref, name: source}
    - kind: with
      distinct: false
      items:
      - expression: {kind: ref, name: target}
        alias: null
      - expression:
          kind: call
          name: point.distance
          arguments:
          - {kind: ref, name: source.center}
          - {kind: ref, name: target.center}
          distinct: false
        alias: distance
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: target.nodeSymbol}
        alias: object
    - kind: order
      items:
      - expression: {kind: ref, name: distance}
        direction: ASC
      - expression: {kind: ref, name: object}
        direction: ASC
    - {kind: limit, value: 1}
  pddl_end_at_nearest_object:
    operations:
    - kind: match
      role: source
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: case.object}
      optional: false
    - kind: match
      role: target
      layers: [Object]
      properties:
        class: {kind: binding, name: case.class}
      optional: false
    - kind: filter
      expression:
        kind: compare
        left: {kind: ref, name: target}
        operator: <>
        right: {kind: ref, name: source}
    - kind: with
      distinct: false
      items:
      - expression: {kind: ref, name: target}
        alias: null
      - expression:
          kind: call
          name: point.distance
          arguments:
          - {kind: ref, name: source.center}
          - {kind: ref, name: target.center}
          distinct: false
        alias: distance
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: target.nodeSymbol}
        alias: object
    - kind: order
      items:
      - expression: {kind: ref, name: distance}
        direction: ASC
      - expression: {kind: ref, name: object}
        direction: ASC
    - {kind: limit, value: 1}
  pddl_visit_place_symbol:
    operations:
    - kind: match
      role: p
      layers: [Place]
      properties:
        nodeSymbol: {kind: binding, name: place}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: p.nodeSymbol}
        alias: place
  pddl_end_at_place_symbol:
    operations:
    - kind: match
      role: p
      layers: [Place]
      properties:
        nodeSymbol: {kind: binding, name: place}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: p.nodeSymbol}
        alias: place
  pddl_visit_mesh_place_symbol:
    operations:
    - kind: match
      role: p
      layers: [MeshPlace]
      properties:
        nodeSymbol: {kind: binding, name: mesh_place}
      optional: false
    - kind: project
      distinct: false
