    - kind: match
      role: reference
      layers: [Object]
      properties:
        class: {kind: binding, name: reference_class}
      optional: false
    - kind: match
      role: target
      layers: [Object]
      properties:
        class: {kind: binding, name: target_class}
      optional: false
    - kind: filter
      expression:
        kind: compare
        left: {kind: ref, name: target}
        operator: <>
        right: {kind: ref, name: reference}
    - kind: with
