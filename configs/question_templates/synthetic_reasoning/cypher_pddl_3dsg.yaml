  pddl_visit_room_symbol:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties:
        nodeSymbol: {kind: binding, name: room}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
  pddl_end_in_room_symbol:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties:
        nodeSymbol: {kind: binding, name: room}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
  pddl_visit_room_class:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties:
        class: {kind: binding, name: room_class}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
    - kind: order
      items:
      - expression: {kind: ref, name: room}
        direction: ASC
  pddl_end_in_room_class:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties:
        class: {kind: binding, name: room_class}
      optional: false
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
    - kind: order
      items:
      - expression: {kind: ref, name: room}
        direction: ASC
  pddl_visit_room_containing_object:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties: {}
      optional: false
    - kind: traverse
      source: r
      target: o
      relationship: CONTAINS
      direction: outgoing
      bounds: [2, 2]
      optional: false
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: case.object}
      optional: false
    - kind: project
      distinct: true
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
    - kind: order
      items:
      - expression: {kind: ref, name: room}
        direction: ASC
  pddl_end_in_room_containing_object:
    operations:
    - kind: match
      role: r
      layers: [Room]
      properties: {}
      optional: false
    - kind: traverse
      source: r
      target: o
      relationship: CONTAINS
      direction: outgoing
      bounds: [2, 2]
      optional: false
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: case.object}
      optional: false
    - kind: project
      distinct: true
      items:
      - expression: {kind: ref, name: r.nodeSymbol}
        alias: room
    - kind: order
      items:
      - expression: {kind: ref, name: room}
        direction: ASC
  pddl_move_object_to_place:
    operations:
    - kind: match
      role: o
      layers: [Object]
      properties:
        nodeSymbol: {kind: binding, name: object}
      optional: false
    - kind: match
      role: p
      layers: []
      properties:
        nodeSymbol: {kind: binding, name: place}
      optional: false
    - kind: filter
      expression:
        kind: logical
        operator: or
        arguments:
        - {kind: label, role: p, layer: Place}
        - {kind: label, role: p, layer: MeshPlace}
    - kind: project
      distinct: false
      items:
      - expression: {kind: ref, name: o.nodeSymbol}
        alias: object
      - expression: {kind: ref, name: p.nodeSymbol}
        alias: place
  pddl_inspect_object_and_end_at_place:
    operations:
    - kind: match
      role: o
