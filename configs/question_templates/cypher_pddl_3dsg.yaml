  - query_type: pddl_inspect_closest_between_classes
    target_questions: 20
    tags: [pddl, inspection, spatial_reference, class_reference, class_restriction, symbol_free]
    variables:
      reference_class: object_classes
      target_class: object_classes
    cypher: |
      MATCH (reference:Object {class: "{reference_class}"})
      MATCH (target:Object {class: "{target_class}"})
      WHERE target <> reference
      WITH reference, target, point.distance(reference.center, target.center) AS distance
      ORDER BY distance ASC, target.nodeSymbol ASC, reference.nodeSymbol ASC
      LIMIT 1
      RETURN target.nodeSymbol AS object
    grounding:
      fields:
        object:
          source: value
          aliases: [object, nodeSymbol]
          symbol_type: Object
          cardinality: set
    goal:
      fact: safe
      arguments: [{result: object}]
    questions:
      - Inspect the {target_class} closest to any {reference_class}.
      - Find the {target_class} with the shortest distance to a {reference_class} and check it for safety.
      - Across all {reference_class} objects, locate and inspect the nearest {target_class}.
      - Examine the target of class {target_class} that lies closest to the {reference_class} class.
      - Mark as safe the {target_class} nearest to at least one {reference_class}.

