    tags: [spatial, nearest, class_restriction]
    solution_formats: [str]
    variables:
      object: object_symbols
    cypher: |
      MATCH (source:Object {nodeSymbol: "{object}"})
      MATCH (target:Object)
      WHERE target <> source AND target.class = source.class
      WITH target, point.distance(source.center, target.center) AS distance
      ORDER BY distance ASC, target.nodeSymbol ASC
      LIMIT 1
      RETURN target.nodeSymbol AS object
    questions:
      - Which object of the same class is nearest to {object}?
      - Find the closest peer of object {object}.
      - What is the nearest other object sharing {object}'s class?
      - Return the closest same-category neighbor of {object}.
      - Locate the nearest object whose class equals that of {object}.

