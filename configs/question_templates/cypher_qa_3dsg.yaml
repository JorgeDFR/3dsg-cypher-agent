  - query_type: closest_cross_class_object_pairs
    empty_ratio: 0.0
    tags: [spatial, nearest, class_contrast, ties]
    solution_formats: ["set[list[str]]"]
    cypher: |
      MATCH (first:Object), (second:Object)
      WHERE toInteger(substring(first.nodeSymbol, 1)) < toInteger(substring(second.nodeSymbol, 1))
        AND first.class <> second.class
      WITH first, second, point.distance(first.center, second.center) AS distance
      WITH collect({first: first.nodeSymbol, second: second.nodeSymbol, distance: distance}) AS rows, min(distance) AS minimum
      UNWIND rows AS row
      WITH row, minimum WHERE row.distance = minimum
      RETURN row.first AS first, row.second AS second
      ORDER BY first, second
    questions:
      - Which differently classified object pair is closest together?
      - Find the nearest pair of objects whose classes differ, including ties.
      - What cross-class object pairs share the minimum distance?
      - Return every closest pair made of objects from different categories.
      - Identify the minimum-distance object pairs with unequal class labels.

