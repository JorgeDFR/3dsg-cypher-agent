domain_description: |
  <PDDL Domain>
    The PDDL domain consists of predicates parameterized by symbols from a 3D scene graph.

    (visited-object ?O): the robot must visit Object ?O.
    (at-object ?O): the robot must end at Object ?O.
    (holding ?O): the robot must hold Object ?O.
    (safe ?O): the robot must inspect Object ?O.
    (visited-region ?R): the robot must visit Region/Room ?R.
    (in-region ?R): the robot must end in Region/Room ?R.
    (visited-place ?P): the robot must visit Place or MeshPlace ?P.
    (at-place ?P): the robot must end at Place or MeshPlace ?P.
    (object-in-place ?O ?P): Object ?O must be located inside Place or MeshPlace ?P.

    Use visited-* when the entity only needs to occur somewhere along the route and the robot may continue afterward. Use at-object, at-place, or in-region when the instruction constrains the robot's final location.

    Compose predicates with 'and' when all listed conditions must hold. Use 'not' for an explicitly prohibited final-state fact. When an instruction is ambiguous about which object, place, mesh place, or region/room is intended, use 'or' so the planner can choose among valid alternatives.
  </PDDL Domain>

predicates:
  visited-object: [Object]
  at-object: [Object]
  holding: [Object]
  safe: [Object]
  visited-region: [Room]
  in-region: [Room]
  visited-place: [PlaceOrMeshPlace]
  at-place: [PlaceOrMeshPlace]
  object-in-place: [Object, PlaceOrMeshPlace]
