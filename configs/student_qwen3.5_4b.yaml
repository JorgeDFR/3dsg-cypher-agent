model:
  base_model: Qwen/Qwen3.5-4B
  tokenizer: null
  trust_remote_code: true
  dtype: bfloat16
  load_in_4bit: false #true

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: auto

training:
  output_dir: outputs/lora/qwen3.5-4b-finetune
  loss_mode: assistant-only
  max_length: 4096
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  num_train_epochs: 2
  warmup_steps: 0
  logging_steps: 10
  eval_steps: 10
  save_steps: 10
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 2
  early_stopping_threshold: 0.0001
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: none

ollama_export:
  model_name: qwen3.5-4b-finetune
  export_root: outputs/ollama
  gguf_outtype: bf16
  quantizations:
    - Q4_K_M
    - Q8_0
  convert_args:
    - --no-mtp # https://github.com/ggml-org/llama.cpp/issues/24737
  modelfile_quantization: bf16
