metadata:
  benchmark_family: 3dsg_student_ollama_model_sweep
  task: cypher
  local_metrics:
    enabled: true
    target_provider: ollama
    ollama_container_name: 3dsg-heracles-benchmark-ollama
    docker_host: tcp://docker-socket-proxy:2375
    ollama_host: http://ollama:11434
    sample_interval_seconds: 0.025
    gpu_baseline_seconds: 5
    unload_models_before_baseline: true
    baseline_adjust_gpu: true

model_sweeps:
  ollama-cypher-students:
    provider: ollama
    phase: main
    configuration_name_template: agentic-cypher-qa-{alias}
    result_configuration_name: agentic-cypher-qa
    models_path: $HERACLES_AGENTS_PATH/examples/experiments/ollama/model_lists/students.yaml
    template:
      dsg_interface:
        dsg_interface_type: none
      pipeline: agentic
      phases:
        main:
          client:
            client_type: ollama
          model_info:
            temperature: 0.2
            seed: 123
          agent_info:
            prompt_settings:
              base_prompt: $HERACLES_AGENTS_PATH/examples/prompts/cypher/qa_agentic_cypher_prompt.yaml
              output_type: SLDP
              answer_type_hint: true
            tools:
              - name: run_cypher_query
                bound_args:
                  dsgdb_conf:
                    dsg_interface_type: heracles
                    uri: $HERACLES_NEO4J_URI
            tool_interface: ollama
            max_iterations: 5
      questions: $HERACLES_AGENTS_PATH/examples/questions/qa_questions.yaml

configurations: {}
