    capabilities: &granite-capabilities
      reasoning: optional
      reasoning_efforts: null
      temperature: true
      seed: true
    parameters: &granite-parameters
      reasoning:
        mode: disabled

  - alias: granite4-1-3b-finetune
    model: granite4.1-3b-finetune
    variant: finetune
    family: granite4.1-3b
    artifact_dir: granite4.1-3b-finetune
    enabled: false
    capabilities: *granite-capabilities
    parameters: *granite-parameters
