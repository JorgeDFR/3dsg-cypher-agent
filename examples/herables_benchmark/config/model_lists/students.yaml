models:
  - alias: qwen3-5-4b-baseline
    model: qwen3.5-4b-baseline
    variant: baseline
    family: qwen3.5-4b
    artifact_dir: qwen3.5-4b-baseline
    enabled: true
    capabilities: &qwen-capabilities
      reasoning: optional
      reasoning_efforts: null
      temperature: true
      seed: true
    parameters: &qwen-parameters
      reasoning:
        mode: disabled

  - alias: qwen3-5-4b-finetune
    model: qwen3.5-4b-finetune
    variant: finetune
    family: qwen3.5-4b
    artifact_dir: qwen3.5-4b-finetune
    enabled: true
    capabilities: *qwen-capabilities
    parameters: *qwen-parameters

  - alias: granite4-1-3b-baseline
