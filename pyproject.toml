[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cypher-3dsg-agent-distillation"
version = "0.1.0"
description = "Fine-tuning and distilling tool-using 3DSG Cypher/Neo4j agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "neo4j>=5.20.0",
  "openrouter>=1.1,<2.0",
  "parse>=1.20.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "spark-dsg>=1.1.3",
  "transformers>=5.0.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.0; platform_system == 'Linux'",
  "peft>=0.12.0",
  "trl>=0.19.1",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["external/heracles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
