[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3dsg-text2cypher"
version = "0.1.0"
description = "Fine-tuning and evaluating text-to-Cypher models for Neo4j 3D Scene Graph databases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "neo4j>=5.20.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "transformers>=4.43.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.0; platform_system == 'Linux'",
  "peft>=0.12.0",
  "trl>=0.9.6",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
